# Build the package with uv and upload it to PyPI when a release is published.
# For more information see: https://docs.astral.sh/uv/guides/package/

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
    - name: Build package
      run: uv build
    - name: Publish package
      run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
