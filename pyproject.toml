[project]
name = "epidemik"
dynamic = ["version"]
authors = [
  { name="Bruno Gonçalves", email="bgoncalves@data4sci.com" },
]
description = "A package to simulate compartmental epidemic models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["epidemiology", "compartmental models", "SIR", "simulation", "networks", "metapopulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.3",
    "networkx>=3",
    "numpy>=1.20",
    "pandas>=2.0",
    "pyyaml>=6",
    "scipy>=1.10",
    "tqdm>=4",
]

[project.urls]
Homepage = "https://github.com/DataForScience/epidemik"
Issues = "https://github.com/DataForScience/epidemik/issues"
Documentation = "https://epidemik.readthedocs.io/"

# Development dependencies, managed by uv (`uv sync` installs the default
# "dev" group; `uv sync --group docs` adds the documentation tools).
[dependency-groups]
dev = [
    "flake8>=7",
    "pytest>=8",
    "pytest-cov>=5",
]
docs = [
    "sphinx>=7",
    "sphinx_rtd_theme>=2",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/epidemik/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/epidemik"]

[tool.hatch.build.targets.sdist]
include = [
    "src/epidemik",
    "tests",
    "models",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
pythonpath = [
  ".", "src",
]
testpaths = ["tests"]
python_files = ["tests_*.py", "test_*.py"]
